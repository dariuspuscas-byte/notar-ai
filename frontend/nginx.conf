server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads (photos, scans, PDFs) can be large. The backend caps
    # each file at 25MB; this allows a few files per request.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API -> backend container.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload triggers synchronous LLM classification, which can be slow.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads to the backend instead of buffering them to disk first.
        proxy_request_buffering off;
    }

    # Vite emits content-hashed file names under /assets, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    # index.html must never be cached, or users keep loading old bundles.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
