[project]
name = "notar-ai-api"
version = "0.1.0"
description = "notar-ai REST/HTTP adapter — imports notar_ai_core, no business logic of its own (specs/ARCHITECTURE.md §1.1)."
requires-python = ">=3.11"
dependencies = [
  "notar-ai-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
