# GPU override for Linux hosts with an NVIDIA GPU and the NVIDIA Container
# Toolkit installed:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Not usable on macOS (Docker Desktop has no Apple GPU passthrough).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
